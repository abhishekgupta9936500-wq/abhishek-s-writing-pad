<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<title>अभिषेक स्मार्ट नोटपैड</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
<style>
body { text-align: center; background: #2c3e50; color: white; font-family: Arial; padding: 20px; }
textarea { width: 90%; height: 150px; font-size: 18px; padding: 10px; border-radius: 8px; border: 2px solid #3498db; background: #ecf0f1; color: #333; resize: none; margin-bottom: 15px;}
button { padding: 12px 25px; font-size: 16px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; width: 40%;}
button:active { background: #2980b9; }
.clear-btn { background: #e74c3c; }
.clear-btn:active { background: #c0392b; }
select { padding: 10px; font-size: 16px; border-radius: 5px; margin-bottom: 15px; width: 40%; }
#status { color: #f1c40f; font-weight: bold; margin-bottom: 15px; }
.subtitle { color: #3498db; font-size: 18px; margin-top: -10px; margin-bottom: 15px; font-weight: bold; }
</style>
</head>
<body>
<h2>ESP32 IoT Notepad</h2>
<div class="subtitle">अभिषेक स्मार्ट नोटपैड</div>
<div id="status">Connecting to Cloud...</div>
<textarea id="messageBox" placeholder="यहाँ अपना मैसेज टाइप करें..."></textarea>

<label for="textSize">Text Size: </label>
<select id="textSize" onchange="changeSize()">
<option value="1">Small (1)</option>
<option value="2">Medium (2)</option>
<option value="3">Large (3)</option>
</select>

<button onclick="sendText()">Send to OLED</button>
<button class="clear-btn" onclick="clearScreen()">Clear OLED</button>
<script>
var mqttClient;
var host = "broker.hivemq.com";
var port = 8884; // HTTPS के लिए secure port 8884 और SSL ज़रूरी है
var topic = "esp32_notepad_mirzapur_123";
function MQTTconnect() {
var clientId = "NoteClient-" + Math.floor(Math.random() * 10000);
mqttClient = new Paho.MQTT.Client(host, port, clientId);
var options = {
useSSL: true, // यह लाइन जोड़ दी गई है ताकि GitHub की वेबसाइट से सिक्योर कनेक्शन बन सके
onSuccess: function() {
document.getElementById("status").innerText = "Ready to Send!";
document.getElementById("status").style.color = "#2ecc71";
},
onFailure: function(message) {
document.getElementById("status").innerText = "Connection Failed: " + message.errorMessage;
document.getElementById("status").style.color = "#e74c3c";
}
};
mqttClient.connect(options);
}
MQTTconnect();
function sendData(msg) {
if (mqttClient && mqttClient.isConnected()) {
var message = new Paho.MQTT.Message(msg);
message.destinationName = topic;
mqttClient.send(message);
} else {
alert("Cloud is not connected yet!");
}
}
function sendText() {
var text = document.getElementById("messageBox").value;
if (text.length > 0) {
sendData(text);
}
}
function clearScreen() {
document.getElementById("messageBox").value = "";
sendData("clear");
}
function changeSize() {
var size = document.getElementById("textSize").value;
sendData("size:" + size);
}
</script>
</body>
</html>
